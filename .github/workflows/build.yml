name: docker-buildx
on:
  push:
    branches:
      - '**'
  schedule:
    - cron: '23 1 1,15 * *'

jobs:
  
  create-release:
    runs-on: [ubuntu-latest]
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Setup Node.js for use with actions
        uses: actions/setup-node@v4
        with:
          node-version: 18
      -
        name: Install Deps
        run: npm install --unsafe-perm
      -
        name: Create Release
        run: npm run create-release -- --skip-opt-packages=ffmpeg-static,ffprobe-static --force-opt-packages
      - uses: actions/upload-artifact@v4
        with:
          name: pigallery2-release
          path: release

  build-dockerx:
    runs-on: [ ubuntu-latest ]
    needs: [ create-release ]
    strategy:
      matrix:
        container: [debian-bullseye ]
        include:
          - container: debian-bullseye
            platforms: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: pigallery2-release
          path: pigallery2-release
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/${{ matrix.container }}/Dockerfile.build
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/${{ github.event.repository.name }}:${{ github.ref_name }}-${{ matrix.container }}
